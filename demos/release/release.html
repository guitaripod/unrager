<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>unrager release video</title>
<style>
@font-face {
  font-family: "JB";
  src: url("fonts/jetbrains-mono-var.woff2") format("woff2");
  font-weight: 100 800;
}
@font-face {
  font-family: "InterV";
  src: url("fonts/inter-var.woff2") format("woff2");
  font-weight: 100 900;
}
:root {
  --bg: #03161c;
  --ink: #e6f0f2;
  --muted: #93aab3;
  --faint: #58727c;
  --teal: #1f6f8b;
  --teal-hi: #62b6d0;
  --rage: #ff5a4f;
  --x-line: #2f3336;
  --x-ink: #e7e9ea;
  --x-muted: #71767b;
  --x-blue: #1d9bf0;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
body { width: 1080px; height: 1080px; overflow: hidden; }
#frame {
  position: relative;
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: "JB", ui-monospace, monospace;
}
#glow {
  position: absolute;
  inset: -10%;
  background:
    radial-gradient(70% 50% at 50% 100%, rgba(31, 111, 139, 0.42), rgba(31, 111, 139, 0) 72%),
    radial-gradient(50% 35% at 88% 0%, rgba(98, 182, 208, 0.09), rgba(98, 182, 208, 0) 70%);
}
#vignette {
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 240px rgba(0, 0, 0, 0.6);
}
#world { position: absolute; inset: 0; }
#browserWrap { position: absolute; inset: 0; }
#cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#browser {
  position: relative;
  width: 720px;
  height: 1800px;
  border-radius: 12px;

}
.tabstrip {
  position: absolute; left: 0; right: 0; top: 0; height: 38px;
  background: #1f2023;
  display: flex; align-items: flex-end; padding: 0 10px; gap: 6px;
}
.tab {
  width: 230px; height: 31px;
  background: #35363a;
  border-radius: 9px 9px 0 0;
  display: flex; align-items: center; gap: 9px; padding: 0 12px;
  font-size: 12.5px; color: #e8eaed;
}
.tab .fav { width: 14px; height: 14px; border-radius: 50%; background: #e8eaed; box-shadow: inset 0 0 0 3.5px #000; }
.tab .close { margin-left: auto; color: #9aa0a6; font-size: 13px; }
.newtab { color: #9aa0a6; font-size: 18px; line-height: 31px; padding: 0 8px; }
.toolbar {
  position: absolute; left: 0; right: 0; top: 38px; height: 44px;

  border-bottom: 1px solid #202124;

}
.toolbar svg { width: 18px; height: 18px; fill: none; stroke: #e8eaed; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.toolbar .dim { stroke: #7d8186; }
.omni {
  flex: 1; height: 30px; border-radius: 15px; background: #202124;

}
.omni svg { width: 14px; height: 14px; stroke: #9aa0a6; }

.ext { position: relative; width: 22px; height: 22px; flex: none; }
.ext svg.mark { width: 22px; height: 22px; stroke: none; }
.mark rect { fill: #1f6f8b; }
.mark path { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.badge {

.avatar-me { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #7b8cff, #3e4bb8); flex: none; }
.xpage { position: absolute; left: 0; right: 0; top: 82px; bottom: 0; }

.cell { position: relative; overflow: hidden; }

.note .show {

#scan { position: absolute; left: 0; width: 600px; height: 0; pointer-events: none; }

.seg {
  position: relative;
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 2px; border-radius: 8px;
  border: 1px solid #28474f; background: #173340;

.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 3); border-radius: 6px; background: #62b6d0; }

.pop-add { display: flex; gap: 6px; margin-top: 8px; }
.pop-add .field { flex: 1; padding: 6px 8px; border-radius: 7px; border: 1px solid #28474f; background: #173340; font-size: 13px; color: #6f8a94; }
.pop-add b { padding: 6px 10px; border-radius: 7px; border: 1px solid #28474f; background: #173340; font-size: 13px; font-weight: 400; }
.builtins ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 13px; }
.builtins li { display: flex; justify-content: space-between; gap: 8px; }
.builtins li span { color: #9db4be; font-size: 12px; }
.pop-area { height: 74px; border-radius: 7px; border: 1px solid #28474f; background: #173340; }
.pop-save { margin-top: 10px !important; }
.pop-save b { display: inline-block; padding: 6px 14px; border-radius: 7px; background: #62b6d0; color: #06222b; font-size: 13px; font-weight: 600; }

.menu {
  position: absolute; min-width: 230px;
  padding: 6px 0;
  border-radius: 8px;
  background: #292a2d;
  border: 1px solid #3c4043;

.mi { position: relative; display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 16px 0 34px; }

#cursor { position: absolute; left: 0; top: 0; width: 20px; height: 26px; transform-origin: 2px 1px; }

.fine { font-weight: 500; font-size: 24px; letter-spacing: -0.015em; color: var(--muted); line-height: 1.45; }

<div id="frame">
  <div id="glow"></div>

      <div id="cam"><div id="browser"></div></div>

  </div>

<script>
const FPS = 60;
const PARAMS = new URLSearchParams(location.search);
const VERSION = PARAMS.get("version") || "0.23.0";
const SHORT_VERSION = VERSION.split(".").slice(0, 2).join(".");
const SC = { title: 3.45, held: 6.35, why: 10.55, call: 15.35, strict: 19.75, model: 24.35, install: 28.75, end: 32.35 };
const DURATION = 35.5;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const EASE = {
  linear: (p) => p,
  inOut: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  inOutQuint: (p) => (p < 0.5 ? 16 * p ** 5 : 1 - Math.pow(-2 * p + 2, 5) / 2),
  cam: (p) => p * p * p * (p * (6 * p - 15) + 10),
  out: (p) => 1 - Math.pow(1 - p, 3),
  outQuart: (p) => 1 - Math.pow(1 - p, 4),
  outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  in: (p) => p * p * p,
  outBack: (p) => {
    const c1 = 1.5;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
  },
};
const ease = (t, a, b, kind = "inOut") => EASE[kind](prog(t, a, b));
const mix = (c1, c2, p) => c1.map((v, i) => Math.round(lerp(v, c2[i], p)));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const RAGE = [255, 90, 79];
const TEAL_HI = [98, 182, 208];

/** Piecewise track over [time, value, easing] keys; values may be numbers or arrays. */
function track(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, kind] = keys[i];
    const [t0, v0] = keys[i - 1];
    if (t <= t1) {
      const p = EASE[kind || "inOut"](t1 === t0 ? 1 : (t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], p)) : lerp(v0, v1, p);
    }
  }
  return keys[keys.length - 1][1];
}

const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
};
const $ = (id) => document.getElementById(id);

const MARK_SVG = '<svg class="mark" viewBox="0 0 32 32"><rect x="0.5" y="0.5" width="31" height="31" rx="7"></rect><path d="M5 16.5 Q7.4 3.5 9.8 16.5 Q12 26.5 14.2 16.5 Q15.6 11 17 16.5 L27 16.5"></path></svg>';

function buildPost(id) {
  const p = POSTS[id];
  const initial = p.name.replace(/[^A-Za-z]/g, "")[0];
  const av = `background: linear-gradient(140deg, hsl(${p.hue} 62% 62%), hsl(${p.hue + 28} 58% 38%))`;
  const [r, rp, l, v] = p.stats;
  return el("article", "post",
    `<div class="av" style="${av}">${initial}</div>
     <div>
       <div class="meta"><b>${p.name}</b><span>@${p.handle} · ${p.ago}</span></div>
       <div class="text">${p.text}</div>
       <div class="actions"><span>${ICON.reply}${r}</span><span>${ICON.repost}${rp}</span><span>${ICON.like}${l}</span><span>${ICON.views}${v}</span></div>

}

/** Offset of an element inside #browser, ignoring the camera transform. */
function offsetIn(node) {
  let x = 0;
  let y = 0;
  const root = $("browser");
  while (node && node !== root) {
    x += node.offsetLeft;
    y += node.offsetTop;
    node = node.offsetParent;
  }
  return { x, y };
}

function center(node) {
  const o = offsetIn(node);
  return { x: o.x + node.offsetWidth / 2, y: o.y + node.offsetHeight / 2 };
}

function measure() {
  for (const id of FEED) {
    const post = $(`cell-${id}`).querySelector(".post");
    state.heights[id] = post.offsetHeight;
  }
  state.rulesH = $("rulesInner").offsetHeight;
  state.builtinsH = $("builtinsInner").offsetHeight;
}

const FEED_TOP = 135;
const arrival = (id) => T.arrivals.find((a) => a.id === id);

/** Hide times for the loud posts in the opening, found by sweeping the scan line down the feed. */
function planHookHides() {
  const hook = FEED.filter((id) => !arrival(id));
  const rage = hook.filter((id) => POSTS[id].rule);
  for (let t = T.scanStart; t <= T.scanEnd + 0.4; t += 1 / 600) {
    const y = scanY(t);
    let top = 0;
    for (const id of hook) {
      const h = hookCellHeight(id, t);
      if (rage.includes(id) && state.hookHide[id] == null && y >= top + 26) state.hookHide[id] = t;
      top += h;
    }
  }
}

function scanY(t) {
  return lerp(-6, 760, ease(t, T.scanStart, T.scanEnd, "inOut"));
}

function hideCurve(t, t0) {
  return ease(t, t0 + 0.28, t0 + 0.72, "inOut");
}

function hookCellHeight(id, t) {
  const h = state.heights[id];
  const t0 = state.hookHide[id];
  if (t0 == null) return h;
  return h * (1 - hideCurve(t, t0));
}

const revealStart = (i) => T.revealAt + 0.1 + 0.07 * i;

/** Everything a feed cell shows at time t: its height and what is drawn inside it. */
function cellState(id, t, order) {
  const p = POSTS[id];
  const h = state.heights[id];
  const noteH = state.noteH;
  const s = { height: h, postY: 0, postOpacity: 1, postShift: 0, held: 0, heldBar: 0, note: 0, noteText: p.rule ? `Hidden: ${p.rule}` : "", tintRage: 0, tintTeal: 0, flash: 0, dim: 1 };
  const a = arrival(id);
  const revealIndex = order.indexOf(id);
  const reveal = ease(t, revealStart(revealIndex), revealStart(revealIndex) + 0.5, "inOut");
  if (a) {
    const grow = ease(t, a.at, a.at + 0.32, "out");
    if (t < a.verdict) {
      s.height = state.heldH * grow;
      s.held = grow;
      s.postOpacity = 0;
      s.heldBar = t;
      return s;
    }
    if (!p.rule) {
      const open = ease(t, a.verdict, a.verdict + 0.5, "inOut");
      s.height = lerp(state.heldH, h, open);
      s.held = 1 - ease(t, a.verdict, a.verdict + 0.2, "out");
      s.postOpacity = ease(t, a.verdict + 0.12, a.verdict + 0.5, "out");
      s.postShift = (1 - s.postOpacity) * 10;
      s.heldBar = a.verdict;
    } else {
      const shut = ease(t, a.verdict + 0.34, a.verdict + 0.7, "inOut");
      s.height = lerp(state.heldH, 0, shut);
      s.held = 1 - ease(t, a.verdict, a.verdict + 0.12, "out");
      s.flash = ease(t, a.verdict + 0.04, a.verdict + 0.18, "out") * (1 - ease(t, a.verdict + 0.52, a.verdict + 0.7));
      s.tintTeal = s.flash;
      s.postOpacity = 0;
      s.heldBar = a.verdict;
      if (reveal > 0) return revealed(s, h, noteH, reveal);
      return s;
    }
  } else if (p.rule) {
    const t0 = state.hookHide[id];
    const turn = ease(t, t0, t0 + 0.18, "out");
    s.tintRage = 1 - turn;
    s.tintTeal = turn * (1 - ease(t, t0 + 0.5, t0 + 0.72));
    s.flash = ease(t, t0 + 0.08, t0 + 0.24, "out") * (1 - ease(t, t0 + 0.52, t0 + 0.72));
    s.height = hookCellHeight(id, t);
    s.postOpacity = 1 - ease(t, t0, t0 + 0.16, "out");
    if (reveal > 0) return revealed(s, h, noteH, reveal);
  }
  if (id === "scene") {
    const u = ease(t, T.userHide + 0.08, T.userHide + 0.5, "inOut");
    if (u > 0) {
      s.height = lerp(s.height, h + noteH, u);
      s.postY = noteH * u;
      s.note = u;
      s.noteText = "Hidden by you";
      s.dim = lerp(1, 0.4, u);
    }
  }
  return s;
}

function revealed(s, h, noteH, r) {
  s.height = lerp(s.height, h + noteH, r);
  s.postY = noteH * r;
  s.note = r;
  s.postOpacity = lerp(s.postOpacity, 1, r);
  s.dim = 0.4;
  s.tintRage = 0;
  s.tintTeal = 0;
  s.flash = 0;
  s.held = 0;
  return s;
}

function feedOrder() {
  return FEED.filter((id) => POSTS[id].rule);
}

function renderFeed(t) {
  const order = feedOrder();
  let y = FEED_TOP;
  state.cellTop = {};
  for (const id of FEED) {
    const cell = $(`cell-${id}`);
    const s = cellState(id, t, order);
    state.cellTop[id] = y;
    y += s.height;
    cell.style.height = `${s.height.toFixed(2)}px`;
    const [held, note, post, tint, flash] = cell.children;
    held.style.opacity = s.held.toFixed(3);
    held.style.display = s.held > 0.001 ? "flex" : "none";
    if (s.held > 0.001) {
      const dots = Math.floor((s.heldBar * 3) % 4);
      held.children[1].textContent = "judging" + ".".repeat(dots);
      held.children[2].style.backgroundPosition = `${(100 - ((s.heldBar * 70) % 100)).toFixed(1)}% 0`;
    }
    note.style.display = s.note > 0.001 ? "flex" : "none";
    note.style.opacity = s.note.toFixed(3);
    note.children[0].textContent = s.noteText;
    post.style.transform = `translateY(${(s.postY + s.postShift).toFixed(2)}px)`;
    post.style.opacity = (s.postOpacity * s.dim).toFixed(3);
    tint.style.display = s.tintRage + s.tintTeal > 0.001 ? "block" : "none";
    tint.style.background = `linear-gradient(90deg, ${rgb(RAGE, 0.16 * s.tintRage)} 0%, ${rgb(RAGE, 0.05 * s.tintRage)} 55%, ${rgb(RAGE, 0.02 * s.tintRage)} 100%), ${rgb(TEAL_HI, 0.18 * s.tintTeal)}`;

/** Every moment the badge count goes up, in order. */
function hideMoments() {
  const out = [];
  for (const [id, t0] of Object.entries(state.hookHide)) out.push(t0 + 0.2);
  for (const a of T.arrivals) if (POSTS[a.id].rule) out.push(a.verdict + 0.1);
  out.push(T.userHide + 0.1);
  return out.sort((a, b) => a - b);
}

function renderBadge(t) {
  const moments = state.moments;
  const n = moments.filter((m) => t >= m).length;
  const badge = $("badge");
  badge.style.display = n > 0 ? "block" : "none";
  badge.textContent = String(n);
  const last = moments.filter((m) => t >= m).pop();
  const bump = last == null ? 0 : 1 - prog(t, last, last + 0.28);
  badge.style.transform = `scale(${(1 + 0.45 * EASE.out(bump) * (bump > 0 ? 1 : 0)).toFixed(3)})`;
  const ping = $("ping");
  const pp = prog(t, T.scanStart - 0.12, T.scanStart + 0.55);
  ping.style.opacity = pp > 0 && pp < 1 ? (0.9 * (1 - pp)).toFixed(3) : "0";
  ping.style.transform = `scale(${lerp(1, 2.6, EASE.out(pp)).toFixed(3)})`;
}

function strictIndex(t) {

  [SC.why + 0.66, "click"],
  [SC.why + 1.36, "click"],
  [SC.why + 2.17, "click"],
  [SC.call + 1.18, "rclick"],

/** Where the cursor sits at time t: eased along its path, following targets that move. */
function cursorAt(t) {
  const path = CURSOR_PATH;
  if (t < path[0][0] || t > path[path.length - 1][0]) return null;
  for (let i = 1; i < path.length; i++) {
    const [t1, f1, style] = path[i];
    const [t0, f0] = path[i - 1];
    if (t <= t1) {
      const a = f0();
      const b = f1();
      const p = EASE.inOutQuint(t1 === t0 ? 1 : (t - t0) / (t1 - t0));
      const reach = style === "straight" ? 0 : Math.min(40, Math.hypot(b.x - a.x, b.y - a.y) * 0.12);
      const bow = Math.sin(Math.PI * p) * reach;
      const nx = -(b.y - a.y);
      const ny = b.x - a.x;
      const len = Math.hypot(nx, ny) || 1;
      return { x: lerp(a.x, b.x, p) + (nx / len) * bow, y: lerp(a.y, b.y, p) + (ny / len) * bow };
    }
  }
  return null;
}

function cursorVisible(t) {
  const spans = [
    [SC.why + 0.02, SC.why + 2.6],
    [SC.call + 0.3, SC.call + 3.0],
    [SC.strict + 0.05, SC.model - 0.1],
  ];
  let v = 0;
  for (const [a, b] of spans) v = Math.max(v, ease(t, a, a + 0.2, "out") * (1 - ease(t, b - 0.3, b)));
  return v;
}

function renderCursor(t) {
  const c = cursorAt(t);
  const cursor = $("cursor");
  const ripple = $("ripple");
  const v = cursorVisible(t);
  if (!c || v <= 0.001) {
    cursor.style.opacity = "0";
    ripple.style.opacity = "0";
    return;
  }
  let press = 0;
  let rip = null;
  for (const [ct, kind] of CLICKS) {
    press = Math.max(press, 1 - Math.min(1, Math.abs(t - ct) / 0.09));
    const rp = prog(t, ct, ct + 0.42);
    if (rp > 0 && rp < 1) rip = { p: rp, kind };
  }
  cursor.style.opacity = v.toFixed(3);
  cursor.style.transform = `translate(${c.x.toFixed(2)}px, ${c.y.toFixed(2)}px) scale(${(1 - 0.14 * press).toFixed(3)})`;
  if (rip) {
    ripple.style.opacity = (0.85 * (1 - rip.p)).toFixed(3);
    ripple.style.borderColor = rip.kind === "rclick" ? "rgba(98,182,208,0.95)" : "rgba(255,255,255,0.9)";
    ripple.style.transform = `translate(${(c.x + 2).toFixed(2)}px, ${(c.y + 1).toFixed(2)}px) scale(${lerp(0.25, 1.15, EASE.out(rip.p)).toFixed(3)})`;
  } else {
    ripple.style.opacity = "0";
  }
}

}

function buildCaptions() {

function renderCaptions(t) {

}

const MARK_PTS = 180;

/** y of the logo's wave at viewBox x (5..27): three quadratic humps settling into a flat line. */
function markY(vx) {
  const segs = [
    [5, 16.5, 7.4, 3.5, 9.8, 16.5],
    [9.8, 16.5, 12, 26.5, 14.2, 16.5],
    [14.2, 16.5, 15.6, 11, 17, 16.5],
  ];
  for (const [x0, y0, , y1, x2, y2] of segs) {
    if (vx <= x2) {
      const u = (vx - x0) / (x2 - x0);
      return (1 - u) * (1 - u) * y0 + 2 * u * (1 - u) * y1 + u * u * y2;
    }
  }
  return 16.5;
}

/** Noise level of the opening's loud feed: one step down for each post hidden. */
function loudness(t) {
  const hides = Object.values(state.hookHide);
  let level = 1;
  for (const h of hides) level -= ease(t, h + 0.1, h + 0.5, "inOut") / hides.length;
  return clamp(level);
}

function noise(x, t) {
  return (
    Math.sin(x * 23 + t * 19) * 0.42 +
    Math.sin(x * 47 - t * 31 + 1.3) * 0.3 +
    Math.sin(x * 83 + t * 47 + 0.7) * 0.18 +
    Math.sin(x * 131 - t * 67 + 2.1) * 0.1
  );
}

function renderLogo(t) {
  const line = $("logoLine");
  const rect = $("logoRect");
  const titleMark = { cx: 540, cy: 392, size: 196 };
  const endMark = { cx: 540, cy: 330, size: 150 };
  const hook = { x0: 616, x1: 1012, y: 98 };
  const inTitle = t < T.endIn;
  const m = inTitle ? titleMark : endMark;
  const k = m.size / 32;
  const mx0 = m.cx - m.size / 2 + 5 * k;
  const mx1 = m.cx - m.size / 2 + 27 * k;
  const move = ease(t, T.titleIn + 0.02, T.titleIn + 0.5, "inOutQuint");
  let shape;
  let fade;
  let x0;
  let x1;
  let yBase;
  let amp = 0;
  let squareIn;
  let width;
  let color;
  if (inTitle) {
    shape = ease(t, T.titleIn + 0.36, T.titleIn + 0.82, "outBack");
    squareIn = ease(t, T.titleIn + 0.38, T.titleIn + 0.76, "outBack");
    fade = ease(t, -1, 0) * (1 - ease(t, T.titleOut, T.titleOut + 0.3, "in"));
    x0 = lerp(hook.x0, mx0, move);
    x1 = lerp(hook.x1, mx1, move);
    yBase = lerp(hook.y, m.cy - m.size / 2 + 16.5 * k, move);
    amp = loudness(t) * (1 - move);
    width = lerp(4, 2.6 * k, ease(t, T.titleIn + 0.3, T.titleIn + 0.7));
    color = mix(mix(RAGE, TEAL_HI, 1 - loudness(t)), [255, 255, 255], ease(t, T.titleIn + 0.38, T.titleIn + 0.66));
    if (t > T.titleOut + 0.3) fade = 0;
  } else {
    shape = ease(t, T.endIn + 0.4, T.endIn + 0.9, "outBack");
    squareIn = ease(t, T.endIn + 0.12, T.endIn + 0.52, "outBack");
    fade = ease(t, T.endIn + 0.05, T.endIn + 0.25);
    x0 = mx0;
    x1 = mx1;
    yBase = m.cy - m.size / 2 + 16.5 * k;
    width = 2.6 * k;
    color = [255, 255, 255];
  }
  const pts = [];
  for (let i = 0; i < MARK_PTS; i++) {
    const u = i / (MARK_PTS - 1);
    const x = lerp(x0, x1, u);
    const vx = 5 + 22 * u;
    const markOff = (markY(vx) - 16.5) * k * shape;
    const env = Math.pow(Math.sin(Math.PI * u), 0.7);
    const n = noise(u, t) * 40 * amp * env;
    pts.push(`${x.toFixed(2)},${(yBase + markOff + n).toFixed(2)}`);
  }
  line.setAttribute("d", `M${pts.join(" L")}`);
  line.style.stroke = rgb(color);
  line.style.strokeWidth = width.toFixed(2);
  line.style.opacity = fade.toFixed(3);
  const size = m.size * lerp(0.4, 1, squareIn);
  rect.setAttribute("x", (m.cx - size / 2).toFixed(2));
  rect.setAttribute("y", (m.cy - size / 2).toFixed(2));
  rect.setAttribute("width", size.toFixed(2));
  rect.setAttribute("height", size.toFixed(2));
  rect.setAttribute("rx", (size * 7 / 32).toFixed(2));
  rect.style.opacity = (clamp(squareIn * 1.4) * fade).toFixed(3);
}

function renderTitle(t) {
  const title = $("title");
  const vis = t > T.titleIn + 0.3 && t < T.titleOut + 0.4;
  title.style.visibility = vis ? "visible" : "hidden";
  if (vis) {
    const out = ease(t, T.titleOut, T.titleOut + 0.3, "in");
    title.style.opacity = (1 - out).toFixed(3);
    title.style.transform = `translateY(${(-20 * out).toFixed(2)}px)`;
    [...$("tWord").children].forEach((c, i) => {
      const p = ease(t, T.titleIn + 0.5 + i * 0.035, T.titleIn + 0.5 + i * 0.035 + 0.5, "outExpo");
      c.style.opacity = p.toFixed(3);
      c.style.transform = `translateY(${((1 - p) * 34).toFixed(2)}px)`;
    });
    const vp = ease(t, T.titleIn + 0.8, T.titleIn + 1.15, "outBack");
    $("tVer").style.opacity = clamp(vp).toFixed(3);
    $("tVer").style.transform = `scale(${lerp(0.6, 1, vp).toFixed(3)})`;
    [...$("tTag").querySelectorAll(".w > i")].forEach((w, i) => {
      const p = ease(t, T.titleIn + 0.84 + i * 0.025, T.titleIn + 0.84 + i * 0.025 + 0.5, "outExpo");
      w.style.transform = `translateY(${((1 - p) * 110).toFixed(2)}%)`;
    });
  }
  const end = $("end");
  const evis = t >= T.endIn;
  end.style.visibility = evis ? "visible" : "hidden";
  if (evis) {
    [...$("eWord").children].forEach((c, i) => {
      const p = ease(t, T.endIn + 0.3 + i * 0.04, T.endIn + 0.3 + i * 0.04 + 0.5, "outExpo");
      c.style.opacity = p.toFixed(3);
      c.style.transform = `translateY(${((1 - p) * 30).toFixed(2)}px)`;
    });
    const fadeUp = (node, a) => {
      const p = ease(t, a, a + 0.5, "outExpo");
      node.style.opacity = p.toFixed(3);
      node.style.transform = `translateY(${((1 - p) * 18).toFixed(2)}px)`;
    };
    fadeUp(end.children[0].querySelector(".ver"), T.endIn + 0.62);
    fadeUp($("eTag"), T.endIn + 0.7);
    fadeUp($("eUrl"), T.endIn + 0.95);
    fadeUp($("eFine"), T.endIn + 1.15);
  }
}

function renderStats(t) {
  const node = $("stats");
  const vis = t >= T.statsIn + 0.3 && t < T.termIn;
  node.style.visibility = vis ? "visible" : "hidden";
  if (!vis) return;
  const inP = ease(t, T.statsIn + 0.3, T.statsIn + 0.85, "outQuart");
  const out = ease(t, T.termIn - 0.35, T.termIn, "inOut");
  node.style.opacity = (inP * (1 - out)).toFixed(3);
  node.style.transform = `translateY(${((1 - inP) * 60 - out * 40).toFixed(2)}px)`;
  const full = 740;
  const bars = [
    [0.04, T.bars[0]],
    [0.16, T.bars[1]],
  ];
  bars.forEach(([v, at], i) => {
    const p = ease(t, at, at + 0.9, "outQuart");
    const w = Math.max(12, (v / 0.16) * full * p);
    $(`bar${i}`).style.width = `${w.toFixed(2)}px`;
    const val = $(`val${i}`);
    val.style.left = `${(w + 24).toFixed(2)}px`;
    val.style.opacity = clamp(p * 2).toFixed(3);
    val.textContent = `${Math.round(v * 100 * p)}%`;
  });
  ["fact0", "fact1", "fact2", "stFoot"].forEach((id, i) => {
    const p = ease(t, T.chips + i * 0.16, T.chips + i * 0.16 + 0.5, "outExpo");
    $(id).style.opacity = p.toFixed(3);
    $(id).style.transform = `translateY(${((1 - p) * 16).toFixed(2)}px)`;
  });
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderTerminal(t) {
  const term = $("term");
  const vis = t >= T.termIn && t < T.endIn + 0.05;
  term.style.visibility = vis ? "visible" : "hidden";
  if (!vis) return;
  const inP = ease(t, T.termIn, T.termIn + 0.5, "outQuart");
  const out = ease(t, T.endIn - 0.3, T.endIn + 0.02, "inOut");
  term.style.opacity = (inP * (1 - out)).toFixed(3);
  term.style.transform = `translateY(${((1 - inP) * 70 + out * 50).toFixed(2)}px) scale(${(1 - out * 0.04).toFixed(4)})`;
  const lines = [];
  let caretLine = -1;
  for (const [i, line] of TERM.entries()) {
    if (t < line.at) break;
    if (line.prompt) {
      const n = Math.floor(line.text.length * prog(t, line.at, line.at + line.type));
      lines.push(`<span class="p">$</span> ${esc(line.text.slice(0, n))}`);
      caretLine = lines.length - 1;
    } else if (line.progress) {
      const p = prog(t, line.progress[0], line.progress[1]);
      const cells = 24;
      const filled = Math.round(cells * EASE.inOut(p));
      lines.push(`<span class="dim">pulling 2.5 GB </span>${"█".repeat(filled)}<span class="dim">${"░".repeat(cells - filled)} ${String(Math.round(100 * EASE.inOut(p))).padStart(3)}%</span>`);
      caretLine = -1;
    } else if (line.ok) {
      lines.push(`<span class="ok">✓</span> ${line.ok.padEnd(11)} ${esc(line.text)}`);
      caretLine = -1;
    } else {
      lines.push(line.cls ? `<span class="${line.cls}">${esc(line.text)}</span>` : esc(line.text));
      caretLine = -1;
    }
  }
  const between = t >= TERM[3].at && t < TERM[4].at;
  const idlePrompt = t < TERM[0].at || between;
  if (idlePrompt) lines.push('<span class="p">$</span> ');
  const blink = Math.floor(t * 2.2) % 2 === 0;
  const caret = '<span class="caret"></span>';
  if (idlePrompt) {
    if (blink) lines[lines.length - 1] += caret;
  } else if (caretLine === lines.length - 1) {
    lines[caretLine] += caret;
  }
  $("termText").innerHTML = lines.join("\n");
}

function renderBackground(t) {
  const g = $("glow");
  g.style.transform = `translate(${(Math.sin(t * 0.35) * 18).toFixed(2)}px, ${(Math.cos(t * 0.27) * 12).toFixed(2)}px)`;
}

function layout(t) {
  renderFeed(t);

function seek(t) {
  renderBackground(t);
  renderFeed(t);
  renderBadge(t);
  renderPopup(t);
  renderMenus(t);
  renderCursor(t);
  renderCamera(t);
  renderCaptions(t);
  renderLogo(t);
  renderTitle(t);
  renderStats(t);
  renderTerminal(t);
}

function collectCues() {
  for (const [id, t0] of Object.entries(state.hookHide)) cue(t0 + 0.18, "hide");
  cue(T.scanStart - 0.1, "scan");
  for (const a of T.arrivals) {
    cue(a.at, "arrive");
    cue(a.verdict, POSTS[a.id].rule ? "hide" : "keep");
  }
  for (const [t, kind] of CLICKS) cue(t, kind);
  cue(T.revealAt + 0.02, "toggle");
  cue(T.menuOpen, "menu");
  cue(T.subOpen, "menu");
  cue(T.userHide + 0.1, "hide");
  cue(T.titleIn, "whoosh");
  cue(T.titleIn + 0.5, "chime");
  cue(T.browserBack, "whoosh");
  cue(T.statsIn, "whoosh");
  for (const b of T.bars) cue(b, "bar");
  cue(T.termIn, "whoosh");
  for (const line of TERM) {
    if (line.prompt) {
      for (let i = 0; i < line.text.length; i++) cue(line.at + (line.type * i) / line.text.length, "key");
      cue(line.at + line.type + 0.12, "enter");
    }
    if (line.ok) cue(line.at, "tick");
  }
  cue(T.endIn, "whoosh");
  cue(T.endIn + 0.4, "chime-end");
  CUES.sort((a, b) => a.t - b.t);
}

async function boot() {
  buildBrowser();
  buildCaptions();
  buildTitle();
  buildStats();
  await document.fonts.load('800 72px "JB"');
  await document.fonts.load('500 29px "JB"');
  await document.fonts.load('400 15px "InterV"');
  await document.fonts.load('700 15px "InterV"');
  await document.fonts.ready;
  measure();
  planHookHides();
  state.moments = hideMoments();
  layout(16.0);
  state.menuPlace = menuPlace();
  state.shots = shots();
  collectCues();
  window.CUES = CUES;
  window.SCENES = SC;
  window.seek = seek;
  window.DURATION = DURATION;
  window.FPS = FPS;
  if (PARAMS.has("t")) {
    seek(parseFloat(PARAMS.get("t")));
  } else if (PARAMS.has("play")) {
    const start = performance.now() - parseFloat(PARAMS.get("play") || "0") * 1000;
    const loop = (now) => {
      seek(((now - start) / 1000) % DURATION);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else {
    seek(0);
  }
  window.__ready = true;
}

boot();
