<!doctype html>
<html lang="en">

<title>unrager video</title>
<style>
@font-face {
  font-family: "JB";
  src: url("fonts/jetbrains-mono-var.woff2") format("woff2");
  font-weight: 100 800;
}
@font-face {
  font-family: "InterV";
  src: url("fonts/inter-var.woff2") format("woff2");
  font-weight: 100 900;
}
:root {
  --bg: #03161c;
  --ink: #e6f0f2;
  --muted: #93aab3;
  --faint: #58727c;
  --teal: #1f6f8b;
  --teal-hi: #62b6d0;
  --rage: #ff5a4f;
  --x-line: #2f3336;

* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
body { width: 1080px; height: 1080px; overflow: hidden; }
#frame {
  position: relative;

  height: 1080px;

}
#glow {
  position: absolute;
  inset: -10%;

    radial-gradient(50% 35% at 88% 0%, rgba(98, 182, 208, 0.09), rgba(98, 182, 208, 0) 70%);
}
#vignette {
  position: absolute;

  box-shadow: inset 0 0 240px rgba(0, 0, 0, 0.6);
}
#world { position: absolute; inset: 0; }
#browserWrap { position: absolute; inset: 0; }
#cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

.pop {

.pop-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }

.pop-name { font-weight: 700; font-size: 15px; }
.pop-status { padding: 12px 14px; border-radius: 10px; background: #173340; border: 1px solid #28474f; }
.pop-headline { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; }

#cursor { position: absolute; left: 0; top: 0; width: 20px; height: 26px; transform-origin: 2px 1px; }

#end { position: absolute; inset: 0; }

.fine { font-weight: 500; font-size: 24px; letter-spacing: -0.015em; color: var(--muted); line-height: 1.45; }
</style>

/** Offset of an element inside #browser, ignoring the camera transform. */
function offsetIn(node) {
  let x = 0;
  let y = 0;
  const root = $("browser");
  while (node && node !== root) {
    x += node.offsetLeft;
    y += node.offsetTop;
    node = node.offsetParent;
  }
  return { x, y };
}

function center(node) {
  const o = offsetIn(node);
  return { x: o.x + node.offsetWidth / 2, y: o.y + node.offsetHeight / 2 };
}

function measure() {
  for (const id of FEED) {
    const cell = $(`cell-${id}`);
    state.heights[id] = cell.querySelector(".post").offsetHeight;
    if (id === "scene") state.confirmH = cell.querySelector(".confirm").offsetHeight;
  }
}

const FEED_TOP = 135;

/** Hide times for the posts the opening's scan line reaches, found by sweeping it down the feed. */
function planHookHides() {
  for (let t = T.scanStart; t <= T.scanEnd + 0.4; t += 1 / 600) {
    const y = scanY(t);
    let top = 0;
    for (const id of FEED) {
      const h = hookCellHeight(id, t);
      if (POSTS[id].rule && state.hookHide[id] == null && y >= top + 26) state.hookHide[id] = t;
      top += h;
    }
  }
}

function scanY(t) {
  return lerp(-6, 820, ease(t, T.scanStart, T.scanEnd, "inOut"));
}

function hideCurve(t, t0) {
  return ease(t, t0 + 0.28, t0 + 0.72, "inOut");
}

function hookCellHeight(id, t) {
  const h = state.heights[id];
  const t0 = state.hookHide[id];
  if (t0 == null) return h;
  return h * (1 - hideCurve(t, t0));
}

const revealStart = (i) => T.revealAt + 0.1 + 0.07 * i;

/** Everything a feed cell shows at time t: its height and what is drawn inside it. */
function cellState(id, t) {
  const p = POSTS[id];
  const h = state.heights[id];
  const noteH = state.noteH;
  const s = { height: h, postY: 0, postOpacity: 1, note: 0, tintRage: 0, tintTeal: 0, flash: 0, dim: 1, confirm: 0, showHot: 0 };
  if (p.rule) {
    const t0 = state.hookHide[id];
    const turn = ease(t, t0, t0 + 0.18, "out");
    s.tintRage = p.mistake ? 0 : 1 - turn;
    s.tintTeal = turn * (1 - ease(t, t0 + 0.5, t0 + 0.72));
    s.flash = ease(t, t0 + 0.08, t0 + 0.24, "out") * (1 - ease(t, t0 + 0.52, t0 + 0.72));
    s.height = hookCellHeight(id, t);
    s.postOpacity = 1 - ease(t, t0, t0 + 0.16, "out");
    const i = HIDDEN.indexOf(id);
    const r = ease(t, revealStart(i), revealStart(i) + 0.5, "inOut");
    if (r > 0) {
      s.height = lerp(s.height, h + noteH, r);
      s.postY = noteH * r;
      s.note = r;
      s.postOpacity = lerp(s.postOpacity, 1, r);
      s.dim = 0.4;
      s.tintRage = 0;
      s.tintTeal = 0;
      s.flash = 0;
    }
    if (p.mistake) {
      const back = ease(t, T.showAt + 0.06, T.showAt + 0.5, "inOut");
      s.showHot = t >= T.showAt - 0.35 && t < T.showAt + 0.1 ? 1 : 0;
      if (back > 0) {
        s.height = lerp(s.height, h, back);
        s.postY = lerp(s.postY, 0, back);
        s.note = s.note * (1 - back);
        s.dim = lerp(0.4, 1, back);
      }
    }
  }
  if (id === "scene") {
    const c = ease(t, T.niAt + 0.05, T.niAt + 0.45, "inOut");
    if (c > 0) {
      s.height = lerp(h, state.confirmH, c);
      s.postOpacity = 1 - ease(t, T.niAt + 0.02, T.niAt + 0.2, "out");
      s.confirm = ease(t, T.niAt + 0.22, T.niAt + 0.5, "out");
    }
  }
  return s;
}

function renderFeed(t) {
  let y = FEED_TOP;
  state.cellTop = {};
  for (const id of FEED) {
    const cell = $(`cell-${id}`);
    const s = cellState(id, t);
    state.cellTop[id] = y;
    y += s.height;
    cell.style.height = `${s.height.toFixed(2)}px`;
    const [note, post, confirm, tint, flash] = cell.children;
    note.style.display = s.note > 0.001 ? "flex" : "none";
    note.style.opacity = s.note.toFixed(3);
    const show = note.children[1];
    show.style.background = s.showHot ? "#1d6f8b" : "#fff";
    show.style.color = s.showHot ? "#fff" : "#1d6f8b";
    post.style.transform = `translateY(${s.postY.toFixed(2)}px)`;
    post.style.opacity = (s.postOpacity * s.dim).toFixed(3);
    confirm.style.display = s.confirm > 0.001 ? "block" : "none";
    confirm.style.opacity = s.confirm.toFixed(3);
    tint.style.display = s.tintRage + s.tintTeal > 0.001 ? "block" : "none";
    tint.style.background = `linear-gradient(90deg, ${rgb(RAGE, 0.16 * s.tintRage)} 0%, ${rgb(RAGE, 0.05 * s.tintRage)} 55%, ${rgb(RAGE, 0.02 * s.tintRage)} 100%), ${rgb(TEAL_HI, 0.18 * s.tintTeal)}`;
    tint.style.boxShadow = `inset 3px 0 0 ${rgb(s.tintTeal > 0 ? TEAL_HI : RAGE, Math.max(s.tintRage, s.tintTeal))}`;
    flash.style.display = s.flash > 0.001 ? "flex" : "none";
    flash.style.opacity = s.flash.toFixed(3);
    flash.style.transform = `translateY(-50%) scale(${lerp(0.92, 1, s.flash).toFixed(3)})`;
  }
  const ni = $("cell-scene").querySelector(".ni");
  const hot = ease(t, T.niAt - 0.45, T.niAt - 0.3, "out") * (1 - ease(t, T.niAt + 0.1, T.niAt + 0.25));
  ni.style.color = rgb(mix([113, 118, 123], [29, 155, 240], hot));
  ni.querySelector(".halo").style.background = `rgba(29, 155, 240, ${(0.14 * hot).toFixed(3)})`;
  const scan = $("scan");
  const sp = prog(t, T.scanStart, T.scanEnd);
  scan.style.display = sp > 0 && sp < 1 ? "block" : "none";
  scan.style.top = `${(53 + scanY(t)).toFixed(1)}px`;
  scan.style.opacity = (1 - ease(t, T.scanEnd - 0.25, T.scanEnd)).toFixed(3);
}

/** Every moment the badge count moves: +1 for each hide, -1 when a post is shown again. */
function badgeMoments() {
  const out = Object.values(state.hookHide).map((t0) => [t0 + 0.2, 1]);
  out.push([T.showAt + 0.1, -1]);
  return out.sort((a, b) => a[0] - b[0]);
}

function renderBadge(t) {
  const moments = state.moments.filter(([m]) => t >= m);
  const n = moments.reduce((sum, [, d]) => sum + d, 0);
  const badge = $("badge");
  badge.style.display = n > 0 ? "block" : "none";
  badge.textContent = String(n);
  const last = moments.length ? moments[moments.length - 1][0] : null;
  const bump = last == null ? 0 : 1 - prog(t, last, last + 0.28);
  badge.style.transform = `scale(${(1 + 0.45 * EASE.out(bump) * (bump > 0 ? 1 : 0)).toFixed(3)})`;
  const ping = $("ping");
  const pp = prog(t, T.scanStart - 0.12, T.scanStart + 0.55);
  ping.style.opacity = pp > 0 && pp < 1 ? (0.9 * (1 - pp)).toFixed(3) : "0";
  ping.style.transform = `scale(${lerp(1, 2.6, EASE.out(pp)).toFixed(3)})`;
}

function popupPlace() {
  const ext = offsetIn($("ext"));
  return { x: ext.x + 22 + 10 - 340, y: 86 };
}

function renderPopup(t) {
  const pop = $("pop");
  const open = t >= T.pop1Open - 0.01 && t < T.pop1Close + 0.2
    ? ease(t, T.pop1Open, T.pop1Open + 0.16, "out") * (1 - ease(t, T.pop1Close, T.pop1Close + 0.16, "in"))
    : 0;
  const place = popupPlace();
  pop.style.left = `${place.x}px`;
  pop.style.top = `${place.y}px`;
  pop.style.visibility = open > 0.001 ? "visible" : "hidden";
  pop.style.opacity = open.toFixed(3);
  pop.style.transform = `scale(${lerp(0.96, 1, open).toFixed(4)})`;
  const on = ease(t, T.revealAt, T.revealAt + 0.16, "inOut");
  $("swRevealTrack").style.background = rgb(mix([40, 71, 79], TEAL_HI, on));
  $("swRevealKnob").style.transform = `translateX(${(14 * on).toFixed(2)}px)`;
}

const fixed = (x, y) => () => ({ x, y });
const cursorTargets = {
  ext: () => {
    const c = center($("ext"));
    return { x: c.x + 2, y: c.y + 3 };
  },
  revealSwitch: () => {
    const c = center($("swRevealTrack"));
    return { x: c.x + 2, y: c.y + 2 };
  },
  away: () => ({ x: 150, y: 300 }),
  show: () => {
    const s = $("cell-priya").querySelector(".show");
    const o = offsetIn(s);
    return { x: o.x + s.offsetWidth * 0.55, y: o.y + s.offsetHeight * 0.6 };
  },
  frown: () => {
    const c = center($("cell-scene").querySelector(".ni"));
    return { x: c.x + 1, y: c.y + 2 };
  },
};

const CURSOR_PATH = [
  [SC.why + 0.02, fixed(640, 560)],
  [SC.why + 0.62, cursorTargets.ext],
  [SC.why + 0.85, cursorTargets.ext],
  [SC.why + 1.22, cursorTargets.revealSwitch],
  [SC.why + 1.62, cursorTargets.revealSwitch],
  [SC.why + 1.92, cursorTargets.away],
  [SC.why + 3.1, cursorTargets.away],
  [T.showAt - 0.08, cursorTargets.show],
  [SC.ni - 0.3, cursorTargets.show],
  [SC.ni + 1.0, fixed(420, 620)],
  [T.niAt - 0.1, cursorTargets.frown],
  [SC.numbers - 0.4, cursorTargets.frown],
];
const CLICKS = [
  [SC.why + 0.66, "click"],
  [T.revealAt - 0.04, "click"],
  [SC.why + 1.93, "click"],
  [T.showAt, "click"],
  [T.niAt, "click"],
];

/** Where the cursor sits at time t: eased along its path, following targets that move. */
function cursorAt(t) {
  const path = CURSOR_PATH;
  if (t < path[0][0] || t > path[path.length - 1][0]) return null;
  for (let i = 1; i < path.length; i++) {
    const [t1, f1, style] = path[i];
    const [t0, f0] = path[i - 1];
    if (t <= t1) {
      const a = f0();
      const b = f1();
      const p = EASE.inOutQuint(t1 === t0 ? 1 : (t - t0) / (t1 - t0));
      const reach = style === "straight" ? 0 : Math.min(40, Math.hypot(b.x - a.x, b.y - a.y) * 0.12);
      const bow = Math.sin(Math.PI * p) * reach;
      const nx = -(b.y - a.y);
      const ny = b.x - a.x;
      const len = Math.hypot(nx, ny) || 1;
      return { x: lerp(a.x, b.x, p) + (nx / len) * bow, y: lerp(a.y, b.y, p) + (ny / len) * bow };
    }
  }
  return null;
}

function cursorVisible(t) {
  const [a, b] = [SC.why + 0.02, SC.numbers - 0.4];
  return ease(t, a, a + 0.2, "out") * (1 - ease(t, b - 0.3, b));
}

function renderCursor(t) {
  const c = cursorAt(t);
  const cursor = $("cursor");
  const ripple = $("ripple");
  const v = cursorVisible(t);
  if (!c || v <= 0.001) {
    cursor.style.opacity = "0";
    ripple.style.opacity = "0";
    return;
  }
  let press = 0;
  let rip = null;
  for (const [ct, kind] of CLICKS) {
    press = Math.max(press, 1 - Math.min(1, Math.abs(t - ct) / 0.09));
    const rp = prog(t, ct, ct + 0.42);
    if (rp > 0 && rp < 1) rip = { p: rp, kind };
  }
  cursor.style.opacity = v.toFixed(3);
  cursor.style.transform = `translate(${c.x.toFixed(2)}px, ${c.y.toFixed(2)}px) scale(${(1 - 0.14 * press).toFixed(3)})`;
  if (rip) {
    ripple.style.opacity = (0.85 * (1 - rip.p)).toFixed(3);
    ripple.style.transform = `translate(${(c.x + 2).toFixed(2)}px, ${(c.y + 1).toFixed(2)}px) scale(${lerp(0.25, 1.15, EASE.out(rip.p)).toFixed(3)})`;
  } else {
    ripple.style.opacity = "0";
  }
}

/** Camera shots: the logical point (lx, ly) of the browser lands on screen at (sx, sy), scaled by s. */
function shots() {
  const at = (t, fn) => {
    renderFeed(t);
    return fn();
  };
  const priyaTop = at(T.showAt - 0.5, () => state.cellTop.priya);
  const sceneTop = at(T.niAt - 0.4, () => state.cellTop.scene);
  const noteShot = (top, s) => [72 + 6 + 540 / s, top + 80, s, 540, 620];
  const postShot = (top, s) => [372, top + 70, s, 540, 650];
  return [
    [0.0, [360, 0, 1.2, 540, 268]],
    [SC.title - 0.05, [360, 0, 1.25, 540, 268], "linear"],
    [T.browserBack, [372, 38, 1.72, 540, 292], "linear"],
    [T.pop1Close + 0.06, [372, 38, 1.78, 540, 292], "linear"],
    [T.pop1Close + 1.0, noteShot(priyaTop, 2.25), "cam"],
    [SC.ni - 0.25, noteShot(priyaTop, 2.32), "linear"],
    [SC.ni + 0.9, postShot(sceneTop, 1.84), "cam"],
    [SC.numbers - 0.3, postShot(sceneTop, 1.9), "linear"],
  ];
}

function renderCamera(t) {
  const [lx, ly, s, sx, sy] = track(t, state.shots);
  $("cam").style.transform = `translate(${(sx - lx * s).toFixed(2)}px, ${(sy - ly * s).toFixed(2)}px) scale(${s.toFixed(4)})`;
  const wrap = $("browserWrap");
  const out1 = ease(t, T.titleIn, T.titleIn + 0.5, "in");
  const back = ease(t, T.browserBack, T.browserBack + 0.6, "outQuart");
  const out2 = ease(t, T.numbersIn, T.numbersIn + 0.4, "inOut");
  let y = 0;
  let o = 1;
  let sc = 1;
  if (t < T.browserBack) {
    y = 180 * out1;
    o = 1 - out1;
    sc = 1 - 0.06 * out1;
  } else {
    y = 160 * (1 - back) - 80 * out2;
    o = back * (1 - out2);
    sc = 1 - 0.05 * (1 - back) - 0.06 * out2;
  }
  wrap.style.transform = `translateY(${y.toFixed(2)}px) scale(${sc.toFixed(4)})`;
  wrap.style.transformOrigin = "540px 700px";
  wrap.style.opacity = o.toFixed(3);
  wrap.style.visibility = o > 0.001 ? "visible" : "hidden";
}

const CAPTIONS = [
  { t0: -1, t1: SC.title - 0.09, y: 60, head: "Keep x.com." },
  { t0: 1.98, t1: SC.title - 0.09, y: 138, head: "Lose the rage." },
  { t0: SC.why + 0.15, t1: SC.ni - 0.3, y: 60, head: "See what it hid,\nand why.", sub: "Got one wrong? One click\nbrings it back for good." },
  { t0: SC.ni + 0.1, t1: SC.numbers - 0.3, y: 60, head: "Not interested?\nOne click.", sub: "X's own Not interested, without the menu,\nso For you shows fewer posts like it." },
  { t0: SC.numbers + 0.1, t1: SC.local - 0.3, y: 60, head: "Tested on\n1,000 real posts.", sub: "Not perfect, and upfront about it." },
  { t0: SC.local + 0.05, t1: SC.end - 0.25, y: 60, head: "Runs on your computer.", sub: "A 2.5 GB model reads every post.\nNothing you read leaves your machine." },
];

function splitWords(text) {
  return text
    .split("\n")
    .map((line) => line.split(" ").map((w) => `<span class="w"><i>${w}</i></span>`).join(" "))
    .join("<br>");
}

function buildCaptions() {
  const root = $("caps");
  for (const c of CAPTIONS) {
    const node = el("div", "cap", `<div class="head">${splitWords(c.head)}</div>${c.sub ? `<div class="sub">${splitWords(c.sub)}</div>` : ""}`);
    node.style.top = `${c.y}px`;
    root.append(node);
    c.node = node;
    c.words = [...node.querySelectorAll(".head .w > i")];
    c.subWords = [...node.querySelectorAll(".sub .w > i")];
  }
}

function renderCaptions(t) {
  for (const c of CAPTIONS) {
    const out = ease(t, c.t1, c.t1 + 0.28, "in");
    const visible = t >= c.t0 - 0.01 && t <= c.t1 + 0.3;
    c.node.style.visibility = visible ? "visible" : "hidden";
    if (!visible) continue;
    c.node.style.opacity = (1 - out).toFixed(3);
    c.node.style.transform = `translateY(${(-16 * out).toFixed(2)}px)`;
    c.words.forEach((w, i) => {
      const p = c.t0 < 0 ? 1 : ease(t, c.t0 + i * 0.055, c.t0 + i * 0.055 + 0.6, "outExpo");
      w.style.transform = `translateY(${((1 - p) * 110).toFixed(2)}%)`;
    });
    const subStart = c.t0 + 0.16 + c.words.length * 0.04;
    c.subWords.forEach((w, i) => {
      const p = ease(t, subStart + i * 0.022, subStart + i * 0.022 + 0.55, "outExpo");
      w.style.transform = `translateY(${((1 - p) * 110).toFixed(2)}%)`;
    });
  }
  const scrim = ease(t, SC.why - 0.35, SC.why + 0.05) * (1 - ease(t, SC.numbers - 0.1, SC.numbers + 0.25));
  $("scrim").style.opacity = scrim.toFixed(3);
}

const MARK_PTS = 180;

/** y of the logo's wave at viewBox x (5..27): three quadratic humps settling into a flat line. */
function markY(vx) {
  const segs = [
    [5, 16.5, 7.4, 3.5, 9.8, 16.5],
    [9.8, 16.5, 12, 26.5, 14.2, 16.5],
    [14.2, 16.5, 15.6, 11, 17, 16.5],
  ];
  for (const [x0, y0, , y1, x2, y2] of segs) {
    if (vx <= x2) {
      const u = (vx - x0) / (x2 - x0);
      return (1 - u) * (1 - u) * y0 + 2 * u * (1 - u) * y1 + u * u * y2;
    }
  }
  return 16.5;
}

/** Noise level of the opening's loud feed: one step down for each rage post hidden. */
function loudness(t) {
  const hides = HIDDEN.filter((id) => !POSTS[id].mistake).map((id) => state.hookHide[id]);
  let level = 1;
  for (const h of hides) level -= ease(t, h + 0.1, h + 0.5, "inOut") / hides.length;
  return clamp(level);
}

function noise(x, t) {
  return (
    Math.sin(x * 23 + t * 19) * 0.42 +
    Math.sin(x * 47 - t * 31 + 1.3) * 0.3 +
    Math.sin(x * 83 + t * 47 + 0.7) * 0.18 +
    Math.sin(x * 131 - t * 67 + 2.1) * 0.1
  );
}

function renderLogo(t) {
  const line = $("logoLine");
  const rect = $("logoRect");
  const titleMark = { cx: 540, cy: 392, size: 196 };
  const endMark = { cx: 540, cy: 330, size: 150 };
  const hook = { x0: 616, x1: 1012, y: 98 };
  const inTitle = t < T.endIn;
  const m = inTitle ? titleMark : endMark;
  const k = m.size / 32;
  const mx0 = m.cx - m.size / 2 + 5 * k;
  const mx1 = m.cx - m.size / 2 + 27 * k;
  const move = ease(t, T.titleIn + 0.02, T.titleIn + 0.5, "inOutQuint");
  let shape;
  let fade;
  let x0;
  let x1;
  let yBase;
  let amp = 0;
  let squareIn;
  let width;
  let color;
  if (inTitle) {
    shape = ease(t, T.titleIn + 0.36, T.titleIn + 0.82, "outBack");
    squareIn = ease(t, T.titleIn + 0.38, T.titleIn + 0.76, "outBack");
    fade = 1 - ease(t, T.titleOut, T.titleOut + 0.3, "in");
    x0 = lerp(hook.x0, mx0, move);
    x1 = lerp(hook.x1, mx1, move);
    yBase = lerp(hook.y, m.cy - m.size / 2 + 16.5 * k, move);
    amp = loudness(t) * (1 - move);
    width = lerp(4, 2.6 * k, ease(t, T.titleIn + 0.3, T.titleIn + 0.7));
    color = mix(mix(RAGE, TEAL_HI, 1 - loudness(t)), [255, 255, 255], ease(t, T.titleIn + 0.38, T.titleIn + 0.66));
    if (t > T.titleOut + 0.3) fade = 0;
  } else {
    shape = ease(t, T.endIn + 0.4, T.endIn + 0.9, "outBack");
    squareIn = ease(t, T.endIn + 0.12, T.endIn + 0.52, "outBack");
    fade = ease(t, T.endIn + 0.05, T.endIn + 0.25);
    x0 = mx0;
    x1 = mx1;
    yBase = m.cy - m.size / 2 + 16.5 * k;
    width = 2.6 * k;
    color = [255, 255, 255];
  }
  const pts = [];
  for (let i = 0; i < MARK_PTS; i++) {
    const u = i / (MARK_PTS - 1);
    const x = lerp(x0, x1, u);
    const vx = 5 + 22 * u;
    const markOff = (markY(vx) - 16.5) * k * shape;
    const env = Math.pow(Math.sin(Math.PI * u), 0.7);
    const n = noise(u, t) * 40 * amp * env;
    pts.push(`${x.toFixed(2)},${(yBase + markOff + n).toFixed(2)}`);
  }
  line.setAttribute("d", `M${pts.join(" L")}`);
  line.style.stroke = rgb(color);
  line.style.strokeWidth = width.toFixed(2);
  line.style.opacity = fade.toFixed(3);
  const size = m.size * lerp(0.4, 1, squareIn);
  rect.setAttribute("x", (m.cx - size / 2).toFixed(2));
  rect.setAttribute("y", (m.cy - size / 2).toFixed(2));
  rect.setAttribute("width", size.toFixed(2));
  rect.setAttribute("height", size.toFixed(2));
  rect.setAttribute("rx", (size * 7 / 32).toFixed(2));
  rect.style.opacity = (clamp(squareIn * 1.4) * fade).toFixed(3);
}

function buildTitle() {
  const word = [..."unrager"].map((ch) => `<i>${ch}</i>`).join("");
  $("title").innerHTML = `
    <div class="lockup" style="top: 538px"><span class="wordmark" id="tWord">${word}</span></div>
    <div class="lockup tagline" id="tTag" style="top: 690px">${splitWords("Rage bait, hidden by a model on your own computer.")}</div>`;
  $("end").innerHTML = `
    <div class="lockup" style="top: 440px"><span class="wordmark" id="eWord">${word}</span></div>
    <div class="lockup tagline" id="eTag" style="top: 590px; color: var(--ink)">Keep x.com. Lose the rage.</div>
    <div class="lockup url" id="eUrl" style="top: 714px">midgarcorp.cc/unrager</div>
    <div class="lockup fine" id="eFine" style="top: 804px">Free and open source, for macOS and Linux.<br>Works in Chrome, Brave, Edge, Vivaldi and Arc.</div>`;
}

function renderTitle(t) {
  const title = $("title");
  const vis = t > T.titleIn + 0.3 && t < T.titleOut + 0.4;
  title.style.visibility = vis ? "visible" : "hidden";
  if (vis) {
    const out = ease(t, T.titleOut, T.titleOut + 0.3, "in");
    title.style.opacity = (1 - out).toFixed(3);
    title.style.transform = `translateY(${(-20 * out).toFixed(2)}px)`;
    [...$("tWord").children].forEach((c, i) => {
      const p = ease(t, T.titleIn + 0.5 + i * 0.035, T.titleIn + 0.5 + i * 0.035 + 0.5, "outExpo");
      c.style.opacity = p.toFixed(3);
      c.style.transform = `translateY(${((1 - p) * 34).toFixed(2)}px)`;
    });
    [...$("tTag").querySelectorAll(".w > i")].forEach((w, i) => {
      const p = ease(t, T.titleIn + 0.8 + i * 0.025, T.titleIn + 0.8 + i * 0.025 + 0.5, "outExpo");
      w.style.transform = `translateY(${((1 - p) * 110).toFixed(2)}%)`;
    });
  }
  const end = $("end");
  const evis = t >= T.endIn;
  end.style.visibility = evis ? "visible" : "hidden";
  if (evis) {
    [...$("eWord").children].forEach((c, i) => {
      const p = ease(t, T.endIn + 0.3 + i * 0.04, T.endIn + 0.3 + i * 0.04 + 0.5, "outExpo");
      c.style.opacity = p.toFixed(3);
      c.style.transform = `translateY(${((1 - p) * 30).toFixed(2)}px)`;
    });
    const fadeUp = (node, a) => {
      const p = ease(t, a, a + 0.5, "outExpo");
      node.style.opacity = p.toFixed(3);
      node.style.transform = `translateY(${((1 - p) * 18).toFixed(2)}px)`;
    };
    fadeUp($("eTag"), T.endIn + 0.6);
    fadeUp($("eUrl"), T.endIn + 0.85);
    fadeUp($("eFine"), T.endIn + 1.05);
  }
}

const N = {
  in: SC.numbers - 0.05,
  dots: SC.numbers + 0.5,
  gone: SC.numbers + 1.0,
  rageVal: SC.numbers + 1.35,
  squares: SC.numbers + 1.7,
  miss: SC.numbers + 2.55,
  goodVal: SC.numbers + 2.75,
  goodNote: SC.numbers + 3.05,
  big: SC.numbers + 3.6,
  bigMiss: SC.numbers + 3.95,
};

function buildNumbers() {
  const squares = (n, cls) => `<div class="squares ${cls}">${"<i></i>".repeat(n)}</div>`;
  $("numbers").innerHTML = `
    <div class="nrow">
      <div class="nlabel">Rage bait it takes out</div>
      <div class="nval" id="rageVal">2 in 3</div>
      <div class="dots" id="rageDots"><i></i><i></i><i></i></div>
    </div>
    <div class="nrow">
      <div class="nlabel">Good posts it hides by mistake</div>
      <div class="nval" id="goodVal">1 in 20</div>
      ${squares(20, "")}
      <div class="nnote" id="goodNote">and every one is a click away, labelled with the rule that hid it</div>
    </div>
    <div class="nrow" id="bigRow">
      <div class="nlabel" style="color: var(--muted)">A 27B model, 7× the size, hid 1 in 4</div>
      ${squares(20, "small")}
      <div class="nfoot">1,049 posts from one real feed, judged against its owner's rules</div>
    </div>`;
}

function renderNumbers(t) {
  const node = $("numbers");
  const vis = t >= N.in && t < T.localIn;
  node.style.visibility = vis ? "visible" : "hidden";
  if (!vis) return;
  const inP = ease(t, N.in, N.in + 0.5, "outQuart");
  const out = ease(t, T.localIn - 0.35, T.localIn, "inOut");
  node.style.opacity = (inP * (1 - out)).toFixed(3);
  node.style.transform = `translateY(${((1 - inP) * 50 - out * 40).toFixed(2)}px)`;
  const fadeUp = (target, a, dy = 14) => {
    const p = ease(t, a, a + 0.45, "outExpo");
    target.style.opacity = p.toFixed(3);
    target.style.transform = `translateY(${((1 - p) * dy).toFixed(2)}px)`;
  };
  [...$("rageDots").children].forEach((dot, i) => {
    const pop = ease(t, N.dots + i * 0.08, N.dots + i * 0.08 + 0.35, "outBack");
    const gone = i < 2 ? ease(t, N.gone + i * 0.16, N.gone + i * 0.16 + 0.35, "inOut") : 0;
    dot.style.transform = `scale(${(pop * (1 - 0.35 * gone)).toFixed(3)})`;
    dot.style.background = rgb(mix(RAGE, [11, 38, 48], gone));
    dot.style.boxShadow = gone > 0 ? `inset 0 0 0 3px ${rgb(TEAL_HI, gone)}` : "none";
  });
  fadeUp($("rageVal"), N.rageVal);
  const rows = $("numbers").querySelectorAll(".squares");
  [...rows[0].children].forEach((sq, i) => {
    const pop = ease(t, N.squares + i * 0.025, N.squares + i * 0.025 + 0.3, "outBack");
    sq.style.transform = `scale(${pop.toFixed(3)})`;
    if (i === 13) {
      const miss = ease(t, N.miss, N.miss + 0.3, "inOut");
      sq.style.background = rgb(mix([207, 225, 230], [23, 51, 64], miss));
      sq.style.boxShadow = miss > 0 ? `inset 0 0 0 3px ${rgb(TEAL_HI, miss)}` : "none";
    }
  });
  fadeUp($("goodVal"), N.goodVal);
  fadeUp($("goodNote"), N.goodNote);
  fadeUp($("bigRow"), N.big, 20);
  [...rows[1].children].forEach((sq, i) => {
    const missed = [2, 7, 11, 15, 18].includes(i);
    const miss = missed ? ease(t, N.bigMiss + i * 0.02, N.bigMiss + i * 0.02 + 0.3, "inOut") : 0;
    sq.style.background = rgb(mix([111, 138, 148], [23, 51, 64], miss));
    sq.style.boxShadow = miss > 0 ? `inset 0 0 0 2px ${rgb(RAGE, miss)}` : "none";
  });
}

function buildLocal() {
  const browser = '<svg viewBox="0 0 48 48" fill="none" stroke="#cfe1e6" stroke-width="2.6" stroke-linejoin="round"><rect x="5" y="9" width="38" height="30" rx="4"/><path d="M5 17h38"/><circle cx="10.5" cy="13" r="1.3" fill="#cfe1e6"/><circle cx="15" cy="13" r="1.3" fill="#cfe1e6"/></svg>';
  const chip = '<svg viewBox="0 0 48 48" fill="none" stroke="#cfe1e6" stroke-width="2.6" stroke-linejoin="round"><rect x="12" y="12" width="24" height="24" rx="3"/><rect x="18" y="18" width="12" height="12" rx="1.5"/><path d="M18 6v6M24 6v6M30 6v6M18 36v6M24 36v6M30 36v6M6 18h6M6 24h6M6 30h6M36 18h6M36 24h6M36 30h6"/></svg>';
  const arrow = '<svg class="larrow" viewBox="0 0 84 20"><path d="M2 10h72" stroke="#62b6d0" stroke-width="3" stroke-dasharray="8 7" fill="none"/><path d="M68 3l10 7-10 7" stroke="#62b6d0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  $("local").innerHTML = `
    <div id="localBox"><span class="tag">your computer</span>
      <div class="lnode" id="ln0" style="left: 44px">${browser}<b>x.com in<br>your browser</b></div>
      <div id="la0" style="position:absolute; left: 294px; top: 0">${arrow}</div>
      <div class="lnode" id="ln1" style="left: 351px"><svg viewBox="0 0 32 32" class="mark" style="width:86px;height:86px">${MARK_SVG.slice(MARK_SVG.indexOf(">") + 1, -6)}</svg><b>unrager</b></div>
      <div id="la1" style="position:absolute; left: 601px; top: 0">${arrow}</div>
      <div class="lnode" id="ln2" style="left: 658px">${chip}<b>a 2.5 GB<br>model</b></div>
    </div>
    <div class="lline" id="lline">No account. No cloud. <em>Nothing leaves.</em></div>`;
}

function renderLocal(t) {
  const node = $("local");
  const vis = t >= T.localIn && t < T.endIn + 0.05;
  node.style.visibility = vis ? "visible" : "hidden";
  if (!vis) return;
  const inP = ease(t, T.localIn, T.localIn + 0.5, "outQuart");
  const out = ease(t, T.endIn - 0.3, T.endIn + 0.02, "inOut");
  node.style.opacity = (inP * (1 - out)).toFixed(3);
  node.style.transform = `translateY(${((1 - inP) * 50 + out * 40).toFixed(2)}px)`;
  const box = $("localBox");
  box.style.opacity = ease(t, T.localIn + 0.1, T.localIn + 0.5).toFixed(3);
  [0, 1, 2].forEach((i) => {
    const p = ease(t, T.localIn + 0.45 + i * 0.22, T.localIn + 0.45 + i * 0.22 + 0.45, "outBack");
    const n = $(`ln${i}`);
    n.style.opacity = clamp(p * 1.3).toFixed(3);
    n.style.transform = `scale(${lerp(0.85, 1, p).toFixed(3)})`;
  });
  [0, 1].forEach((i) => {
    const a = $(`la${i}`);
    const p = ease(t, T.localIn + 0.75 + i * 0.22, T.localIn + 1.1 + i * 0.22, "out");
    a.style.opacity = p.toFixed(3);
    const dash = a.querySelector("path");
    dash.style.strokeDashoffset = `${(-t * 40).toFixed(1)}`;
  });
  const l = $("lline");
  const p = ease(t, T.localIn + 1.5, T.localIn + 2.0, "outExpo");
  l.style.opacity = p.toFixed(3);
  l.style.transform = `translateY(${((1 - p) * 16).toFixed(2)}px)`;
}

function renderBackground(t) {
  $("glow").style.transform = `translate(${(Math.sin(t * 0.35) * 18).toFixed(2)}px, ${(Math.cos(t * 0.27) * 12).toFixed(2)}px)`;
}

function seek(t) {
  renderBackground(t);
  renderFeed(t);
  renderBadge(t);
  renderPopup(t);
  renderCursor(t);
  renderCamera(t);
  renderCaptions(t);
  renderLogo(t);
  renderTitle(t);
  renderNumbers(t);
  renderLocal(t);
}

function collectCues() {
  for (const [id, t0] of Object.entries(state.hookHide)) cue(t0 + 0.18, "hide", { mistake: !!POSTS[id].mistake });
  cue(T.scanStart - 0.1, "scan");
  for (const [t, kind] of CLICKS) cue(t, kind);
  cue(T.revealAt + 0.02, "toggle");
  cue(T.showAt + 0.08, "keep");
  cue(T.niAt + 0.2, "confirm");
  cue(T.titleIn, "whoosh");
  cue(T.titleIn + 0.4, "chime");
  cue(T.browserBack, "whoosh");
  cue(T.numbersIn, "whoosh");
  for (let i = 0; i < 2; i++) cue(N.gone + i * 0.16, "hide");
  cue(N.miss, "dim");
  cue(N.bigMiss, "dim");
  cue(T.localIn, "whoosh");
  cue(T.localIn + 0.75, "flow");
  cue(T.endIn, "whoosh");
  cue(T.endIn + 0.4, "chime-end");
  CUES.sort((a, b) => a.t - b.t);
}

async function boot() {
  buildBrowser();
  buildCaptions();
  buildTitle();
  buildNumbers();
  buildLocal();
  await document.fonts.load('800 72px "JB"');
  await document.fonts.load('500 29px "JB"');
  await document.fonts.load('400 15px "InterV"');
  await document.fonts.load('700 15px "InterV"');
  await document.fonts.ready;
  measure();
  planHookHides();
  state.moments = badgeMoments();
  state.shots = shots();
  collectCues();
  window.CUES = CUES;
  window.SCENES = SC;
  window.seek = seek;
  window.DURATION = DURATION;
  window.FPS = FPS;
  if (PARAMS.has("t")) {
    seek(parseFloat(PARAMS.get("t")));
  } else if (PARAMS.has("play")) {
    const start = performance.now() - parseFloat(PARAMS.get("play") || "0") * 1000;
    const loop = (now) => {
      seek(((now - start) / 1000) % DURATION);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else {
    seek(0);
  }
  window.__ready = true;
}

boot();
