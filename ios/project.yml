name: Unrager
options:
  bundleIdPrefix: com.guitaripod
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "26.5"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_REGION_BASED_ISOLATION: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${UNRAGER_TEAM_ID}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  UnragerKit:
    path: ../UnragerKit

targets:
  Unrager:
    type: application
    platform: iOS
    sources:
      - path: Unrager
    dependencies:
      - package: UnragerKit
        product: UnragerKit
    info:
      path: Unrager/Info.plist
      properties:
        CFBundleDisplayName: Unrager
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIRequiredDeviceCapabilities: [arm64]
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Unrager saves tweet photos and videos to your photo library when you choose Save from a tweet.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.guitaripod.unrager.refresh]
        LSApplicationQueriesSchemes: [twitter]
        UNRAGER_DEFAULT_SERVER: http://100.91.211.44:7777
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.unrager
        PRODUCT_NAME: Unrager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  UnragerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnragerTests]
    dependencies:
      - target: Unrager
      - package: UnragerKit
        product: UnragerKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.unrager.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Unrager.app/Unrager
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Unrager:
    build:
      targets:
        Unrager: all
        UnragerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [UnragerTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
