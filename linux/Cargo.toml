[workspace]
members = ["core", "app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
repository = "https://github.com/guitaripod/unrager"

[workspace.dependencies]
unrager-model = { path = "../crates/unrager-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "multipart", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "fs", "io-util"] }
futures = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "5"
toml = "0.8"
url = "2"
thiserror = "2"
