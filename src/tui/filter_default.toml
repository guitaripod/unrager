# unrager's rules: posts mainly about one of these topics are hidden.
# Edit them here or from the browser extension's popup; cached verdicts are
# dropped automatically whenever the rules or the model change.

drop_topics = [
    "american electoral politics, presidents, congress, partisan fights",
    "war, military conflict, battlefield footage, casualty counts, geopolitical saber-rattling",
    "gender wars, men-vs-women discourse, trad-vs-feminist fights",
    "trans and LGBTQ culture-war framing",
    "uber-nationalism, flag-waving identity politics of any country",
    "migrants and refugees in europe framed as a crisis or threat",
    "systemic abuse framing (institutional predators, coverups, mass-victim narratives)",
    "race-based outrage, racial grievance framing",
    "economic fearmongering: tariff panic, inflation doom, market-crash prophecies, recession scaremongering, trade-war catastrophizing",
    "contrarian dunking on AI companies (Anthropic, OpenAI, Google, etc.), Claude-bashing, performative AI safety panic, AGI doomerism, AI-will-steal-all-jobs alarmism, anecdotal LLM failure stories ('I asked ChatGPT/Claude/Gemini to do X and it couldn't'), screenshot-of-bad-output dunking",
    "crypto and NFT shilling, pump-and-dump hype, rug-pull drama",
    "celebrity and influencer cancellation drama, parasocial outrage",
    "rage-bait reply farming, ratio threads, deliberately inflammatory hot takes designed to farm engagement",
    "politicians, heads of state, government officials, EU commissioners, members of parliament — any tweet BY or primarily ABOUT a political figure",
    "X/Twitter creator payouts, ad revenue sharing, monetization complaints, impressions-farming-for-money discourse, payout screenshots",
]
extra_guidance = "KEEP technical, scientific, art, music, sports, personal-life, and humor tweets that only mention these topics in passing. KEEP genuine AI research, product announcements, and thoughtful critique. HIDE if the topic IS the point of the tweet."

# How readily a post is hidden. "relaxed": only posts clearly about one of
# the topics above. "balanced": those, plus rage bait, dunking and
# engagement farming; a post the model isn't sure about stays. "strict":
# also posts by people known for a topic, and anything the model isn't sure
# about.
strictness = "balanced"

# The model that reads each post. It runs on your computer; nothing is sent
# anywhere else.
[llm]
# Ollama, the default: install it from https://ollama.com, then run
# `ollama pull qwen3:4b-instruct`. It's 2.5 GB and fast, and in unrager's
# tests it hid fewer good posts than models many times its size;
# `unrager eval` checks any other model you try.
backend = "ollama"
host = "http://localhost:11434"
model = "qwen3:4b-instruct"
timeout_seconds = 20
# How long Ollama keeps the model loaded after the last post it checked, so
# new posts are judged at once. "30m" keeps it through a browsing session;
# "10s" hands the GPU back to games and other apps soon after you stop
# scrolling; "-1" keeps it loaded for good.
keep_alive = "30m"
# Ask, brief and translate in the terminal client use `model` too. To give
# them a bigger model while the filter keeps the small one, set `model` to
# the big one and uncomment this:
# filter_model = "qwen3:4b-instruct"

# Any other server that speaks the OpenAI chat API works too: LM Studio,
# vLLM, llama.cpp's llama-server, SGLang, llama-swap. Replace the lines above
# with something like:
#
#   backend = "openai"
#   host = "http://localhost:1234"   # LM Studio 1234, vLLM 8000,
#                                    # llama-server 8080, SGLang 30000
#   model = "qwen3-8b"               # an id from the server's /v1/models
#   timeout_seconds = 120            # a model that has to load first is slow
#   # api_key = "..."                # only if the server wants one
#
# `unrager doctor` checks that the model answers, and if it can't reach the
# one set here, prints these lines for any server it finds on those ports.
